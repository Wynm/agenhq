# Auto-publish Arabic articles to دليل التقنية with Google Gemini.
# Needs the repository secret GEMINI_API_KEY (Settings → Secrets and variables → Actions).
# Frequency: edit the cron line below (times are UTC; Morocco = UTC+1).
#   "0 8 * * *"        → every day at 08:00 UTC (1 run/day)
#   "0 8,18 * * *"     → twice a day
#   "0 8 * * 1,3,5"    → Monday, Wednesday, Friday
# Articles per run: automation/config.json → posts_per_run (or repo variable POSTS_PER_RUN).
name: Auto publish articles

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many articles to publish now (1-5)"
        required: false
        default: "1"
      mode:
        description: "auto = mix news + evergreen topics"
        type: choice
        options: [auto, news, evergreen]
        default: auto

permissions:
  contents: write
  pages: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get install -y -qq libfribidi0 libharfbuzz0b >/dev/null 2>&1 || true
          pip install -q -r automation/requirements.txt

      - name: Generate article(s)
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          POSTS_PER_RUN: ${{ inputs.count || vars.POSTS_PER_RUN }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: python automation/generate.py

      - name: Commit and push
        if: steps.gen.outputs.published != ''
        env:
          PUBLISHED: ${{ steps.gen.outputs.published }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-publish: ${PUBLISHED}"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

      - name: Ask GitHub Pages to rebuild (safety net)
        if: steps.gen.outputs.published != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || echo "Pages rebuild request skipped (it usually deploys by itself)."
